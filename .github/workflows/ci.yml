name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  format:
    name: Formatting and lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
      - name: Run pre-commit hooks
        run: uvx pre-commit run --all-files --show-diff-on-failure --hook-stage pre-commit

  test:
    name: Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write  # test-result check run
      pull-requests: write  # test-result PR comment
      id-token: write  # Codecov upload via OIDC
    env:
      PYTHONPATH: src
      MPLBACKEND: Agg
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pyvista/setup-headless-display-action@v5
      - name: Install Octave (tests/test_amm.py runs SPM's AMM as the reference)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends octave
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked --group dev
      - name: Run tests
        run: >-
          uv run pytest -o addopts="" -v --tb=short --durations=15
          --junitxml=pytest.xml --cov=custom --cov-report=term
          --cov-report=xml
      - name: Coverage summary
        if: always()
        run: uv run coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          files: coverage.xml
          fail_ci_if_error: false
      - name: Publish test results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: pytest.xml

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install docs dependencies
        run: pip install -r docs/requirements.txt
      - name: Build documentation
        run: sphinx-build -b html docs docs/_build/html
